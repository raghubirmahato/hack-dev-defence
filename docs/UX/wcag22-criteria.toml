# WCAG 2.2 level A and AA success criteria: the list the `ux-docs` accessibility check validates the
# mapping in docs/UX/ACCESSIBILITY.md against (T-0022 A1, `Tests` line).
#
# Source: https://www.w3.org/TR/WCAG22/ (W3C Recommendation, 12 December 2024), fetched 2026-10-20.
# The six criteria new in WCAG 2.2 were also checked against the W3C source fragments at
# https://github.com/w3c/wcag/tree/main/guidelines/sc/22 (fetched 2026-10-20). WCAG 2.2 has 55 level A
# and AA success criteria: 31 at level A and 24 at level AA. 4.1.1 Parsing is obsolete and removed in
# WCAG 2.2, so it is not in this list. Titles and levels are transcribed, never paraphrased.
#
# A criterion is never invented or edited here to make the mapping pass; if a criterion is missing from
# this list, the mapping check reports the mapped row as outside the stored list.
#
# UNVERIFIED(no independent review of the transcription): the ids, titles and levels below were
# transcribed by the implementing agent from the fetched page and have not been checked by a second
# reviewer against the published recommendation.
version = "2.2"
source = "https://www.w3.org/TR/WCAG22/"
accessed = "2026-10-20"

