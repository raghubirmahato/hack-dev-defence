# Dependency vetting register (R-08, T-0008 step 5). Read by `cargo xtask deps check` (step `dependency-vetting` of verify).
#
# Every external crate declared in a workspace manifest needs one entry. Facts (version, licence, MSRV, last release) are read
# from the registry (`cargo metadata` + the crates.io API) on the vetting date and never asserted from memory.
# A crate that wraps C/C++ (`ffi`), exposes `unsafe` in its public API (`unsafe_api`), or whose latest release is older than
# 365 days additionally needs an ADR (`adr = "NNNN"`) that exists in docs/adr/.
#
# Tools installed on the builder (not dependencies of the workspace), vetted 2026-10-18 from the registry:
#   tokei 15.0.0 (MIT OR Apache-2.0, last release 2026-09-06), cargo-vet 0.10.2 (Apache-2.0/MIT, 2026-01-13),
#   cargo-geiger 0.14.0 (MIT OR Apache-2.0, 2026-10-12), cargo-nextest 0.9.148, cargo-deny 0.20.2, cargo-audit, cargo-machete.

