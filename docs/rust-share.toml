# Rust-share configuration (DEV-V5-002, section 5). Read by `cargo xtask rust-share`.
# Rust must be at least `min_rust_percent` of hand-written programming-language code lines (tokei `code`).
# Generated code, vendored files, migrations, YAML/TOML configuration and Markdown are excluded and LISTED in the report.

min_rust_percent = 90.0

# tokei language names counted as programming languages (Python and PowerShell/Batch count so that stray scripts show up).
programming = ["Rust", "JavaScript", "TypeScript", "SQL", "Shell", "BASH", "Python", "PowerShell", "Batch", "Perl", "Ruby", "Go", "C", "C++", "Java"]
css_languages = ["CSS", "Sass", "LESS"]
html_languages = ["HTML", "Jinja2", "Askama"]
js_languages = ["JavaScript"]

# Caps for declarative markup / first-party JavaScript (section 5).
css_cap = 12000
html_cap = 40000
js_cap = 3000

# Exclusions are matched per file (repository-relative path).
[[exclude]]
glob = "migrations/**"
kind = "migrations"
reason = "schema migrations are SQL by definition (DEV-V5-002)"

[[exclude]]
glob = "**/vendor/**"
kind = "vendored"
reason = "vendored third-party files with recorded checksums (HTMX, axe-core, fonts, icons, map data)"

[[exclude]]
glob = "**/generated/**"
kind = "generated"
reason = "generated code (OpenAPI client, bindings); regenerated by xtask"

[[exclude]]
glob = "**/*.generated.*"
kind = "generated"
reason = "generated code"

[[exclude]]
glob = "design/prototypes/**"
kind = "other"
reason = "labelled design artifacts, excluded from builds (R-16)"

[[exclude]]
glob = "tests/fixtures/**"
kind = "other"
reason = "tagged payload fixtures, not product code"

[[exclude]]
glob = "lab/vendor/**"
kind = "vendored"
reason = "digest-pinned third-party lab material (section 2.8)"

# HK1 demo track (ASM-HK1(k)): the rehearsal kit and the developer launchers are not product code, so they are shown
# as excluded material instead of counting against the Rust share or the first-party JavaScript cap.
[[exclude]]
glob = "lab/demo/**"
kind = "lab"
reason = "HK1 lab-only rehearsal kit (intentionally vulnerable app, attack scripts, payload catalogue), never shipped"

[[exclude]]
glob = "scripts/**"
kind = "other"
reason = "HK1 developer launchers and their node --test tests (Addendum 4), tooling rather than product code"
