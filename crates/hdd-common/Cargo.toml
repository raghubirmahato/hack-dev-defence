[package]
name = "hdd-common"
description = "config, models, kv traits (KvStore, Bus, Limiter) with Redis and in-process backends, pub/sub messages, errors, Ray ID, client-IP resolution, egress client, profile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["redis"]
# The hosted backend of the store traits (redis-rs over rustls/ring; Lua scripts for the named atomic operations, ADR-0028).
redis = ["dep:redis"]
# Shared conformance suite for the store traits (also used by the Redis run).
conformance = []

[dependencies]
redis = { version = "1.7.1", optional = true, default-features = false, features = ["aio", "tokio-comp", "tokio-rustls-comp", "script", "connection-manager"] }
bytes = "1.12.1"
getrandom = "0.4.3"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8.5"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
tokio = { version = "1.53.3", features = ["rt", "net", "time", "io-util", "sync", "macros"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
proptest = "1.12.0"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "test-util"] }

[[test]]
name = "kv_redis"
required-features = ["conformance", "redis"]

[[bench]]
name = "kv_limiter"
harness = false
required-features = ["redis"]
