[package]
name = "hdd-acceptance"
description = "live suite, PASS/FAIL/UNVERIFIED reporter, target and egress allowlists, safety limits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
hdd-common = { version = "0.0.0", path = "../hdd-common" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["rt", "time", "sync", "macros", "signal"] }

[dev-dependencies]
proptest = "1.12.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "test-util"] }
