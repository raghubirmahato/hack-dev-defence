[package]
name = "hdd-proxy"
description = "TLS, host router, pipeline, rate limiter, ACME, cert store, origin health"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = "0.6.0"
bytes = "1.12.1"
getrandom = "0.4.3"
hdd-common = { path = "../hdd-common", default-features = false }
hdd-waf-core = { path = "../hdd-waf-core" }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
regex = "1.13.1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros", "signal"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
proptest = "1.12.0"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "test-util"] }
